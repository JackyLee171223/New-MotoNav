name: Build MotoNav Standard APK

on:
  workflow_dispatch:

jobs:
  build-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 核心修改：跳过第三方插件，直接同意系统自带的 Android 协议
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      # 可选：强制要求使用 35 版本，如果系统自带版本不够，它会自动下载
      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Standard Debug APK
        working-directory: android/standard
        run: gradle --no-daemon assembleDebug

      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoNav-Standard-APK
          path: android/standard/**/build/outputs/apk/**/*.apk
          retention-days: 7
